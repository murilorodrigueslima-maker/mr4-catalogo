<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{HEAD}}
<link rel="icon" type="image/png" href="/assets/favicon-opt.png">
<link rel="stylesheet" href="/css/catalogo.css?v=perf1-10">
</head>
<body{{BODYATTRS}}>
<a class="skip-link" href="#conteudo">Ir para os produtos</a>

<header class="topo">
  {{LOGO}}
  <form class="busca" id="buscaForm" role="search" action="/" method="get">
    <label class="sr-only" for="searchInput">Buscar produtos por nome, código, marca ou categoria</label>
    <button class="busca-ico" type="submit" aria-label="Buscar">⌕</button>
    <input class="search-input" type="search" id="searchInput" name="q" placeholder="Busque produto, código, marca ou categoria" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="search-clear" type="button" id="searchClear" aria-label="Limpar busca" hidden>✕</button>
  </form>
  <div class="acoes-topo">
    <button class="btn-atend" type="button" id="btnContato"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/></svg><span>Atendimento</span></button>
    <button class="btn-pedido" type="button" id="cartFab" aria-label="Abrir meu pedido (0 itens)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="t-pedido">Pedido</span><span class="badge" id="cartBadge" aria-hidden="true">0</span></button>
  </div>
</header>

<div class="layout">
  <aside class="lateral" id="lateral" aria-label="Categorias e marcas">
    <nav aria-label="Categorias">
      <div class="cat-titulo">Categorias</div>
      <div id="catLista">{{CATS}}</div>
    </nav>
    <details class="marcas" id="marcaDet">
      <summary>Marca <span class="atual" id="marcaAtual"></span></summary>
      <div class="lista" id="marcaLista">{{MARCAS}}</div>
    </details>
  </aside>

  <main id="conteudo" class="conteudo">
    <div class="filtros-m" id="filtrosM">
      <button type="button" class="fbtn" id="btnCat" aria-haspopup="dialog"><span>Categorias</span></button>
      <button type="button" class="fbtn" id="btnMarca" aria-haspopup="dialog"><span>Marca</span></button>
      <button type="button" class="fbtn" id="btnOrdem" aria-haspopup="dialog"><span>Ordenar</span></button>
    </div>
    <div class="barra">
      {{H1}}<div class="result-info" id="resultInfo" role="status" aria-live="polite">{{RESULTINFO}}</div>
      <button type="button" class="btn-rapido" id="btnRapido" aria-expanded="false" aria-controls="rapido" aria-label="Abrir pedido rápido (atalho Alt+Q)" title="Pedido rápido (Alt+Q)"><span aria-hidden="true">⚡</span> <span class="rp-longo">Pedido rápido</span><span class="rp-curto">Rápido</span></button>
      <span class="barra-quebra" aria-hidden="true"></span>
      <div class="modo" role="group" aria-label="Modo de exibição">
        <button type="button" class="modo-btn" data-modo="visual" aria-pressed="true"><span aria-hidden="true">▦</span> Visual</button>
        <button type="button" class="modo-btn" data-modo="compacto" aria-pressed="false"><span aria-hidden="true">☰</span> Compacto</button>
      </div>
      <div class="ordenar">
        <label for="sortSelect">Ordenar</label>
        <select class="sort-select" id="sortSelect">
          <option value="padrao">Categoria + estoque</option>
          <option value="destaque">Destaques primeiro</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="menor-preco">Menor preço</option>
          <option value="maior-preco">Maior preço</option>
          <option value="maior-estoque">Maior estoque</option>
        </select>
      </div>
    </div>
    <h2 class="sr-only">Produtos</h2>
    <div class="grade" id="grid" aria-busy="true">{{SKELETON}}</div>
    <div class="load-more" id="loadMore" hidden>
      <button class="btn-more" type="button" id="btnMore">Mostrar mais produtos</button>
      <small id="moreInfo"></small>
    </div>
  {{LISTA}}
  </main>
</div>
{{CONTEXTO}}

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTit">
    <div class="sheet-head"><h2 id="sheetTit">Filtro</h2><button type="button" class="sheet-close" id="sheetClose" aria-label="Fechar">✕</button></div>
    <div class="sheet-list" id="sheetLista" role="radiogroup" aria-labelledby="sheetTit"></div>
  </div>
</div>

<footer>
  <div><strong>MR4 Distribuidora</strong> · Atacado B2B · Atendemos CE · PI · RN</div>
  <div>CNPJ 38.440.066/0001-75 · Rua Ceará, 634 · Fortaleza, CE</div>
  <div class="rodape-dir"><span class="sync-badge" id="syncBadge"></span> <button class="rodape-atend" type="button" id="rodapeAtend">Falar com atendimento</button></div>
</footer>

<script src="/js/catalogo-core.js?v=perf1-10"></script>
<script src="/js/catalogo-cesta.js?v=perf1-10"></script>
<script src="/js/catalogo-rapido.js?v=perf1-10"></script>
<script src="/js/catalogo-app.js?v=perf1-10"></script>
</body>
</html>
